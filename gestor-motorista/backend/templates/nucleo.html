<style>
  :root{--bg:#0a0c13;--bg2:#0d1019;--surface:#11141f;--surface2:#161a28;--raised:#1a1f30;--hair:#1e2336;--hair2:#2a3150;
    --text:#eaecf4;--muted:#969cba;--faint:#5e6483;--accent:#e7a948;--green:#62c08c;--red:#e36f80;--info:#6fa9da;--violet:#9b8cff;

  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

  input::placeholder,textarea::placeholder{color:#5e6483}textarea{resize:vertical;line-height:1.45}a{color:var(--info);text-decoration:none}

  .navi:hover{background:var(--surface)}.navi.on{background:var(--surface2);color:var(--text)}.navi .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .main{flex:1;min-width:0;padding:30px 32px 80px;max-width:1100px}
  @media(max-width:820px){.app{flex-direction:column}.side{width:auto;flex:none;height:auto;position:sticky;top:0;z-index:20;display:flex;gap:5px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--hair);padding:10px 12px}.brand,.navsec{display:none}.navi{margin:0;white-space:nowrap;padding:9px 13px}.main{padding:20px 18px 60px}}
  .head{margin-bottom:22px}.head h1{font-size:27px;font-weight:600}.head .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:var(--sp)}@media(min-width:780px){.g3{grid-template-columns:1fr 1fr 1fr}.g2{grid-template-columns:1fr 1fr}}
  .ttl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .view{display:none}.view.on{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.view.on{animation:none}}
  .prog{height:7px;border-radius:5px;background:var(--bg2);overflow:hidden;margin-top:8px}.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:5px}

  .wk .l{font-size:12px;color:var(--muted);margin-top:2px}.wk.c1 .n{color:var(--violet)}.wk.c2 .n{color:var(--red)}.wk.c3 .n{color:var(--info)}
  .track{border:1px solid var(--hair);border-radius:var(--r);padding:18px;background:var(--surface)}
  .track.t-cont{border-left:3px solid var(--violet)}.track.t-rof{border-left:3px solid var(--red)}.track.t-pan{border-left:3px solid var(--info)}
  .track h3{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:3px}

  .bigdone input{width:20px;height:20px;accent-color:var(--green)}.bigdone span{font-family:"Space Grotesk";font-weight:600}

  .roles{display:flex;gap:10px;flex-wrap:wrap}.rcell{flex:1;min-width:150px;background:var(--surface2);border:1px solid var(--hair2);border-radius:11px;padding:13px}
  .rcell b{font-family:"Space Grotesk";font-size:13px}.rcell .x{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .rmweek{border:1px solid var(--hair);border-radius:12px;padding:15px;margin-bottom:12px;background:var(--surface)}
  .rmweek.active{border-color:var(--red)}
  .rmweek .hd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}.rmweek .hd .wn{font-family:"Space Grotesk";font-weight:700;color:var(--red)}
  .rmweek .hd h4{font-size:15px}.rmweek .hd .pc{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;cursor:pointer}.item input{width:17px;height:17px;accent-color:var(--green)}.item.done span{color:var(--muted);text-decoration:line-through}
  .promptbox{background:var(--bg2);border:1px solid var(--hair2);border-radius:11px;padding:14px;margin-bottom:10px}
  .promptbox .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}.promptbox .ph b{font-family:"Space Grotesk";font-size:13px}
  .promptbox pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;color:#cfd3ea;margin:0}
  .arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
  .art{aspect-ratio:1;border-radius:11px;border:1px solid var(--hair2);background:var(--surface2) center/cover no-repeat;position:relative;overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--faint);text-align:center;padding:5px}
  .art .d{position:absolute;bottom:0;left:0;right:0;background:rgba(6,8,14,.82);font-size:9px;padding:3px;color:var(--muted)}
  .filebtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--hair2);border-radius:11px;color:var(--muted);font-size:13px;cursor:pointer;font-family:"Space Grotesk";font-weight:500}
  .filebtn:hover{border-color:var(--accent);color:var(--text)}.prev{width:100%;height:120px;border-radius:10px;background:var(--bg2) center/contain no-repeat;border:1px solid var(--hair);margin-top:10px;display:none}
  .products{display:grid;gap:14px}@media(min-width:560px){.products{grid-template-columns:1fr 1fr}}
  .product{background:var(--bg2);border:1px solid var(--hair2);border-radius:12px;padding:13px}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pslot{display:flex;flex-direction:column;gap:7px}
  .pslot-lbl{font-size:10.5px;color:var(--muted);font-family:"Space Grotesk";font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .pslot-img{aspect-ratio:1;border-radius:10px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--hair2);cursor:pointer}
  .pslot-add{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--hair2);background:var(--surface);color:var(--faint);font-size:11.5px;display:grid;place-items:center;cursor:pointer;text-align:center;padding:6px;width:100%;font-family:"Space Grotesk"}
  .pslot-add:hover{border-color:var(--accent);color:var(--text)}
  .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-family:"Space Grotesk";font-weight:700;font-size:20px}
  .brain{background:linear-gradient(170deg,var(--surface2),var(--surface));border:1px solid var(--hair2);border-radius:16px;padding:16px}
  .composer{display:flex;gap:8px;margin-top:8px}.brainfoot{margin-top:8px;text-align:right}.linklike{font-size:11.5px;color:var(--muted);cursor:pointer}.linklike:hover{color:var(--info)}
  .chatlog{max-height:200px;overflow:auto}.msg{padding:10px 13px;border-radius:11px;margin-bottom:8px;font-size:13.5px;white-space:pre-wrap}.msg.u{background:var(--raised)}.msg.a{background:rgba(111,169,218,.07);border:1px solid rgba(111,169,218,.2)}.msg.a small{display:block;color:var(--info);font-size:10.5px;margin-bottom:4px;font-family:"Space Grotesk";font-weight:600}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--accent);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--shadow)}.toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(4,5,10,.72);display:none;place-items:center;z-index:60;padding:18px}.modal.show{display:grid}
  .modal .box{background:var(--surface);border:1px solid var(--hair2);border-radius:16px;padding:22px;width:420px;max-width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal h3{font-size:18px;margin-bottom:14px}
  .editrow{display:flex;align-items:center;gap:8px;margin:8px 0}.editrow label{flex:1;color:var(--muted);font-size:12.5px}.editrow input{width:110px;text-align:right}
  /* gate de duas senhas */
  #ngate{position:fixed;inset:0;background:#0a0c13;display:grid;place-items:center;z-index:200;padding:20px}
  #ngate .gbox{background:var(--surface);border:1px solid var(--hair2);border-radius:16px;padding:24px;width:360px;max-width:100%;box-shadow:var(--shadow)}
  #ngate h2{font-size:20px;margin-bottom:4px}
  #ngate p{font-size:13px;color:var(--muted);margin:0 0 8px}
  #ngate label{font-size:11.5px;color:var(--muted);display:block;margin:12px 0 5px}
  #ngate .err{color:var(--red);font-size:12.5px;margin-top:12px;display:none}
</style>
</head>
<body>
<div id="ngate">
  <div class="gbox">
    <div class="brand" style="padding:0 0 14px"><div class="mk">N</div><div class="nm">Núcleo</div></div>
    <h2>Central de comando</h2>
    <p>Área exclusiva. Duas chaves pra entrar.</p>
    <label>Senha do admin</label>
    <input id="g_at" type="password" autocomplete="off" placeholder="primeira senha">
    <label>Senha do Núcleo</label>
    <input id="g_nt" type="password" autocomplete="off" placeholder="segunda senha">
    <div style="margin-top:18px"><button class="btn" id="g_go" style="width:100%">Entrar</button></div>
    <div class="err" id="g_err">Chave incorreta. Tenta de novo.</div>
  </div>
</div>

<script>
/* ===== NÚCLEO: trava de duas senhas + storage shim (grava no Supabase via /admin) ===== */
(function(){
  function tok(){return {at:localStorage.getItem("nucleo_at")||"",nt:localStorage.getItem("nucleo_nt")||""};}
  function api(path,opts){opts=opts||{};var t=tok();opts.headers=Object.assign({"Content-Type":"application/json","x-admin-token":t.at,"x-nucleo-token":t.nt},opts.headers||{});return fetch(path,opts);}
  window.storage={
    get:function(k){var t=tok();if(!t.at||!t.nt)return Promise.resolve(null);
      return api("/admin/nucleo-get?k="+encodeURIComponent(k)).then(function(r){if(r.status===401||r.status===403){showGate();return null;}if(!r.ok)return null;return r.json();}).then(function(d){return (d&&d.value!=null)?{key:k,value:d.value}:null;}).catch(function(){return null;});},
    set:function(k,v){var t=tok();if(!t.at||!t.nt)return Promise.resolve(null);
      return api("/admin/nucleo-set",{method:"POST",body:JSON.stringify({k:k,v:v})}).then(function(r){if(r.status===401||r.status===403){showGate();return null;}return r.ok?{key:k,value:v}:null;}).catch(function(){return null;});}
  };
  var gate=document.getElementById("ngate");
  function showGate(){gate.style.display="grid";}
  function hideGate(){gate.style.display="none";}
  function tryVerify(at,nt,onErr){
    fetch("/admin/nucleo-get?k=__ping__",{headers:{"x-admin-token":at,"x-nucleo-token":nt}}).then(function(r){
      if(r.ok){localStorage.setItem("nucleo_at",at);localStorage.setItem("nucleo_nt",nt);location.reload();}
      else{onErr();}
    }).catch(function(){onErr();});
  }
  document.getElementById("g_go").addEventListener("click",function(){
    var at=document.getElementById("g_at").value.trim(),nt=document.getElementById("g_nt").value.trim();
    var err=document.getElementById("g_err");err.style.display="none";
    if(!at||!nt){err.textContent="Preenche as duas chaves.";err.style.display="block";return;}
    var btn=this;btn.textContent="Entrando…";
    tryVerify(at,nt,function(){err.textContent="Chave incorreta. Tenta de novo.";err.style.display="block";btn.textContent="Entrar";});
  });
  document.getElementById("g_nt").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("g_go").click();});
  var t0=tok();
  if(t0.at&&t0.nt){hideGate();}else{showGate();}
})();
</script>

<script>
(function(){
  "use strict";
  var mem={};var hasStore=(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function");
  function load(k,d){return new Promise(function(res){if(!hasStore){res(k in mem?mem[k]:d);return;}window.storage.get(k).then(function(r){try{res(r&&r.value!=null?JSON.parse(r.value):d)}catch(e){res(d)}},function(){res(k in mem?mem[k]:d)});});}
  function save(k,v){mem[k]=v;try{if(hasStore)window.storage.set(k,JSON.stringify(v))}catch(e){}}
  function el(s){return document.getElementById(s)}
  function toast(m){var t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},1800)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function brl(n){n=Number(n)||0;return "R$ "+n.toLocaleString("pt-BR",{maximumFractionDigits:2})}
  function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function uid(){return Math.random().toString(36).slice(2,9)}
  function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Copiado")},fb)}else fb();function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado")}catch(e){}document.body.removeChild(a)}}
  function openModal(){el("modal").classList.add("show")}function closeModal(){el("modal").classList.remove("show")}
  el("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});

  var ART_SEED="Ultra detailed vintage athletic apparel artwork, premium streetwear back print, central symmetrical composition, massive collegiate typography integrated into the illustration, engraved bear mascot, powerlifting aesthetic, American traditional engraving, distressed ink texture, bold athletic lettering, apparel brand artwork, lightning bolts, stars, banners, ornamental details, high density composition, white background, navy blue ink, luxury fitness brand identity, not poster design, not movie poster, real t-shirt graphic design.";
  var ROADMAP_SEED=[
    {wn:1,titulo:"Posicionamento",itens:[{t:"Manifesto definitivo da marca",done:false},{t:"Arquétipo (quem é o cara da Roffil)",done:false},{t:"Público — uma tribo só",done:false}]},
    {wn:2,titulo:"Coleção Built To Evolve",itens:[{t:"Definir 8 produtos",done:false},{t:"Mockups",done:false},{t:"Descrições",done:false}]},
    {wn:3,titulo:"Loja",itens:[{t:"Organização da loja",done:false},{t:"Integrações",done:false},{t:"Checkout funcionando",done:false}]},
    {wn:4,titulo:"Marketing",itens:[{t:"Instagram estruturado",done:false},{t:"Influenciadores",done:false},{t:"Conteúdo",done:false}]}
  ];
  var CHN=[["ytPt","YouTube PT"],["ytEn","YouTube EN"],["ttPt","TikTok PT"],["ttEn","TikTok EN"],["igPt","Instagram PT"],["igEn","Instagram EN"]];

  var DIARIO={},ROADMAP=[],PROMPTS=[],COLECAO=[],BACKLOG=[],CAP={},CRIA={},CHAT=[],lastAsk={sys:"",q:""};

  function weekStart(){var d=new Date();var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return dkey(d);}
  function today(){var k=dkey();if(!DIARIO[k])DIARIO[k]={conteudo:{tarefa:"",canais:{}},roffil:{tarefa:"",done:false},painel:{tarefa:"",done:false}};return DIARIO[k];}
  function saveDiario(){save("nucleo6:diario",DIARIO)}
  function videoPublished(e){return CHN.every(function(c){return e&&e.conteudo&&e.conteudo.canais&&e.conteudo.canais[c[0]]})}
  function weekCounts(){var ws=weekStart();var v=0,r=0,p=0;Object.keys(DIARIO).forEach(function(k){if(k<ws)return;var e=DIARIO[k];if(videoPublished(e))v++;if(e.roffil&&e.roffil.done)r++;if(e.painel&&e.painel.done)p++;});return{v:v,r:r,p:p};}
  function activeWeek(){for(var i=0;i<ROADMAP.length;i++){if(ROADMAP[i].itens.some(function(x){return !x.done}))return ROADMAP[i];}return ROADMAP[ROADMAP.length-1];}

  [].forEach.call(document.querySelectorAll(".navi"),function(b){if(b.id==="backupNav")return;b.addEventListener("click",function(){var v=b.getAttribute("data-v");
    [].forEach.call(document.querySelectorAll(".navi"),function(x){x.classList.toggle("on",x===b)});
    [].forEach.call(document.querySelectorAll(".view"),function(s){s.classList.toggle("on",s.id==="v-"+v)});

  function ctx(){var aw=activeWeek();var wc=weekCounts();return "Holding em construção. Frentes ativas: Conteúdo (1 vídeo/dia → 6 canais), Roffil (virar marca; foco atual: "+(aw?("Semana "+aw.wn+" "+aw.titulo):"-")+"), painel.ia (30min/1 tarefa). Pausados: a8nuts, autor.ai. Esta semana: "+wc.v+" vídeos, "+wc.r+" avanços Roffil, "+wc.p+" painel. CEO dirige Uber 10-12h/dia. Meça progresso por peças avançadas, não dinheiro. Respostas curtas, PT-BR.";}
  function mountBrain(){var hb=el("brainHost");if(!hb)return;hb.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-family:\'Space Grotesk\';font-weight:600">✶ Núcleo IA</span><span class="small">— estratégia rápida; se não responder aqui, copie e cole no ChatGPT</span></div><div class="chatlog" id="chatlog"></div><div class="composer"><textarea id="chatIn" rows="1" placeholder="ex: me dá o manifesto da Roffil em 5 linhas"></textarea><button class="btn" id="sendBtn">Enviar</button></div><div class="brainfoot"><span class="linklike" id="copyAsk">↗ copiar última pergunta p/ ChatGPT/Gemini</span></div>';
    el("sendBtn").onclick=send;el("chatIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
    el("copyAsk").onclick=function(){if(!lastAsk.q){toast("Faça uma pergunta primeiro");return;}copy(lastAsk.sys+"\n\nPergunta: "+lastAsk.q)};renderChat();}
  function renderChat(){var b=el("chatlog");if(!b)return;b.innerHTML=CHAT.map(function(m){return '<div class="msg '+(m.role==="user"?"u":"a")+'">'+(m.role==="assistant"?'<small>Núcleo</small>':'')+esc(m.text)+'</div>'}).join("");b.scrollTop=b.scrollHeight;}
  function send(){var t=el("chatIn").value.trim();if(!t)return;el("chatIn").value="";CHAT.push({role:"user",text:t});CHAT.push({role:"assistant",text:"…"});renderChat();
    var sys="Você é o braço-direito do CEO. "+ctx();lastAsk={sys:sys,q:t};
    var hist=CHAT.filter(function(m){return m.text!=="…"}).slice(-8).map(function(m){return {role:m.role==="user"?"user":"assistant",content:m.text}});
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:hist})})
      .then(function(r){return r.json()}).then(function(d){var txt=(d&&d.content?d.content:[]).filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("\n").trim();CHAT[CHAT.length-1]={role:"assistant",text:txt||"(sem resposta)"};renderChat();})
      .catch(function(){CHAT[CHAT.length-1]={role:"assistant",text:"Não respondi aqui (ambiente bloqueando). Toque em “copiar última pergunta” e cole no ChatGPT — já vai com o contexto."};renderChat();});}

  el("backupNav").addEventListener("click",function(){el("modalBox").innerHTML='<h3>Backup dos dados</h3><div class="small" style="margin-bottom:14px">Baixe tudo num arquivo e guarde no Drive. Restaure quando quiser, em qualquer aparelho — assim você nunca perde nada.</div><button class="btn" id="expBtn" style="width:100%;margin-bottom:10px">⤓ Baixar backup agora</button><label class="filebtn" id="impLbl">⤒ Restaurar de um arquivo<input id="impFile" type="file" accept="application/json" style="display:none"></label><div style="margin-top:14px"><button class="btn ghost" id="bX" style="width:100%">Fechar</button></div>';
    openModal();el("bX").onclick=closeModal;el("expBtn").onclick=exportAll;el("impLbl").onclick=function(){el("impFile").click()};el("impFile").onchange=function(){var f=this.files&&this.files[0];if(f)importAll(f)};});
  function exportAll(){var imgs={};var jobs=[];Object.keys(CRIA).forEach(function(w){(CRIA[w]||[]).forEach(function(a){if(a.hasImg)jobs.push(load("nucleo6:img:"+a.id,null).then(function(dt){if(dt)imgs["nucleo6:img:"+a.id]=dt}))})});
    COLECAO.forEach(function(c){["arte","mockup"].forEach(function(s){var ref=c&&c[s];if(ref&&ref.hasImg)jobs.push(load("nucleo6:img:"+ref.id,null).then(function(dt){if(dt)imgs["nucleo6:img:"+ref.id]=dt}))})});
    Promise.all(jobs).then(function(){var data={v:6,diario:DIARIO,roadmap:ROADMAP,prompts:PROMPTS,colecao:COLECAO,backlog:BACKLOG,cap:CAP,cria:CRIA,imgs:imgs};var blob=new Blob([JSON.stringify(data)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nucleo-backup-"+dkey()+".json";document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},100);toast("Backup baixado");});}
  function importAll(file){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);
    if(d.diario){DIARIO=d.diario;save("nucleo6:diario",DIARIO)}if(d.roadmap){ROADMAP=d.roadmap;save("nucleo6:roadmap",ROADMAP)}if(d.prompts){PROMPTS=d.prompts;save("nucleo6:prompts",PROMPTS)}if(d.colecao){COLECAO=d.colecao;save("nucleo6:colecao",COLECAO)}if(d.backlog){BACKLOG=d.backlog;save("nucleo6:backlog",BACKLOG)}if(d.cap){CAP=d.cap;save("nucleo6:cap",CAP)}if(d.cria){CRIA=d.cria;save("nucleo6:cria",CRIA)}if(d.imgs)Object.keys(d.imgs).forEach(function(k){save(k,d.imgs[k])});
    closeModal();renderHoje();toast("Backup restaurado");}catch(e){toast("Arquivo inválido")}};fr.readAsText(file);}

  function boot(){Promise.all([load("nucleo6:diario",null),load("nucleo6:roadmap",null),load("nucleo6:prompts",null),load("nucleo6:colecao",null),load("nucleo6:backlog",null),load("nucleo6:cap",null),load("nucleo6:cria",null)]).then(function(r){
    DIARIO=r[0]||{};ROADMAP=r[1]||JSON.parse(JSON.stringify(ROADMAP_SEED));PROMPTS=r[2]||[{titulo:"Estilo oficial — vintage athletic back print",texto:ART_SEED}];
    COLECAO=r[3]||[{nome:""},{nome:""},{nome:""},{nome:""},{nome:""},{nome:""},{nome:""},{nome:""}];BACKLOG=r[4]||[];CAP=r[5]||{roffil:{fat:0,inv:0},painel:{fat:0,inv:0}};CRIA=r[6]||{roffil:[],painel:[]};
    if(!r[1])save("nucleo6:roadmap",ROADMAP);if(!r[2])save("nucleo6:prompts",PROMPTS);if(!r[3])save("nucleo6:colecao",COLECAO);
    renderHoje();});}
  boot();
})();
</script>
