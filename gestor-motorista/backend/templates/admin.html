<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel.IA — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#07090d;--card:#0d1117;--line:rgba(255,255,255,.08);--tx:#EEE9E0;--mt:rgba(238,233,224,.45);--am:#F0B429;--gn:#00D897;--rd:#FF4560}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:1100px;margin:0 auto}
.header{display:flex;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.logo .p{width:32px;height:32px;border-radius:50%;background:var(--am);color:#000;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex-shrink:0}
.nav{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.nav::-webkit-scrollbar{display:none}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--mt);border-radius:20px;padding:7px 16px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit;transition:.2s}
.nav button.active{background:var(--am);border-color:var(--am);color:#000;font-weight:700}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mt);margin-bottom:4px}
.card .v{font-size:22px;font-weight:800}
.card.mrr{border-color:rgba(240,180,41,.4);grid-column:span 2}.card.mrr .v{color:var(--am);font-size:28px}
.chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}
canvas{max-height:200px;width:100%!important}
.vagas{margin-bottom:20px}
.vagas .lbl{font-size:12px;color:var(--mt);margin-bottom:6px}
.vt{height:8px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden}
.vf{height:100%;background:linear-gradient(90deg,var(--am),var(--gn));border-radius:6px;transition:width 1s}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros button{background:var(--card);border:1px solid var(--line);color:var(--mt);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
.filtros button.active{background:rgba(240,180,41,.15);border-color:var(--am);color:var(--am)}
.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px;font-family:inherit}
.search::placeholder{color:var(--mt)}
.search:focus{outline:none;border-color:rgba(240,180,41,.4)}
/* Mobile: cards */
.users-cards{display:flex;flex-direction:column;gap:8px}
.user-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.uc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.uc-name{font-weight:700;font-size:15px}
.uc-email{font-size:12px;color:var(--mt);margin-top:2px;word-break:break-all}
.uc-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mt)}
.uc-meta span{background:rgba(255,255,255,.04);border-radius:6px;padding:3px 8px}
/* Desktop: tabela */
.users-table{display:none}
@media(min-width:700px){.users-cards{display:none}.users-table{display:block;overflow-x:auto}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt)}
tr:last-child td{border-bottom:none}
.st{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.st-trial{background:rgba(78,158,255,.15);color:#4E9EFF}
.st-active{background:rgba(0,216,151,.15);color:var(--gn)}
.st-expired{background:rgba(255,69,96,.12);color:var(--rd)}
.st-cancelled,.st-sem_plano{background:rgba(255,255,255,.08);color:var(--mt)}
.loading{text-align:center;padding:40px;color:var(--mt);font-size:14px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><span class="p">⚡</span>&nbsp;Admin</div>
</div>
<nav class="nav">
  <button class="active" onclick="showPage('dash',this)">Dashboard</button>
  <button onclick="showPage('users',this)">Usuários</button>
  <button onclick="showPage('remarketing',this)">Remarketing</button>
  <button onclick="showPage('suporte',this)">Suporte</button>
</nav>

<div class="page active" id="page-dash">
  <div class="grid" id="cards"><div class="loading">Carregando...</div></div>
  <div class="vagas">
    <div class="lbl">Vagas Fundador: <b id="vg-num" style="color:var(--am)">—</b> de 50</div>
    <div class="vt"><div class="vf" id="vg-fill" style="width:0%"></div></div>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<div class="page" id="page-users">
  <input class="search" type="search" id="busca" placeholder="🔍 Buscar por nome ou email..." oninput="renderUsuarios()">
  <div class="filtros">
    <button class="active" onclick="setFiltro('all',this)">Todos</button>
    <button onclick="setFiltro('active',this)">Ativos</button>
    <button onclick="setFiltro('trial',this)">Trial</button>
    <button onclick="setFiltro('expired',this)">Expirados</button>
    <button onclick="setFiltro('sem_plano',this)">Sem plano</button>
    <button onclick="setFiltro('cancelled',this)">Bloqueados</button>
  </div>
  <div class="users-cards" id="users-cards"><div class="loading">Carregando...</div></div>
  <div class="users-table">
    <table><thead><tr><th>Nome</th><th>Email</th><th>Status</th><th>Plano</th><th>Trial expira</th><th>Cadastro</th></tr></thead>
    <tbody id="tbody"></tbody></table>
  </div>
</div>

<div class="page" id="page-remarketing">
  <div class="card"><div class="l">Em breve</div><div style="color:var(--mt);font-size:14px;margin-top:8px">Campanhas de remarketing para usuários trial e expirados.</div></div>
</div>
<div class="page" id="page-suporte">
  <div class="card"><div class="l">Em breve</div><div style="color:var(--mt);font-size:14px;margin-top:8px">Central de suporte e tickets.</div></div>
</div>

<script>
let TOKEN = sessionStorage.getItem('admin_token');
if(!TOKEN){ TOKEN = prompt('Token de admin:'); if(TOKEN) sessionStorage.setItem('admin_token', TOKEN); }
const H = {'X-Admin-Token': TOKEN||''};
const fmt = v => 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
const fdt = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
let todosUsuarios = [], filtroAtual = 'all', usersCarregados = false;

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='users' && !usersCarregados) carregarUsuarios();
}

function setFiltro(st, btn){
  filtroAtual = st;
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderUsuarios();
}

async function carregar(){
  const r = await fetch('/admin/metricas',{headers:H});
  if(r.status===401){ sessionStorage.removeItem('admin_token'); alert('Token inválido'); location.reload(); return; }
  const d = await r.json();
  document.getElementById('cards').innerHTML = `
    <div class="card mrr"><div class="l">MRR</div><div class="v">${fmt(d.mrr)}</div></div>
    <div class="card"><div class="l">Usuários</div><div class="v">${d.usuarios_total}</div></div>
    <div class="card"><div class="l">Em trial</div><div class="v" style="color:#4E9EFF">${d.em_trial}</div></div>
    <div class="card"><div class="l">Ativos</div><div class="v" style="color:var(--gn)">${d.ativos}</div></div>
    <div class="card"><div class="l">Expirados</div><div class="v" style="color:var(--rd)">${d.expirados||0}</div></div>
    <div class="card"><div class="l">Conversão</div><div class="v">${d.conversao_pct}%</div></div>
    <div class="card"><div class="l">Novos 7d</div><div class="v">${d.novos_semana}</div></div>`;
  document.getElementById('vg-num').textContent = d.vagas_fundador;
  document.getElementById('vg-fill').style.width = ((50-d.vagas_fundador)/50*100)+'%';
  new Chart(document.getElementById('chart'),{type:'line',data:{
    labels:d.por_dia.map(x=>x.dia.slice(5)),
    datasets:[{label:'Novos',data:d.por_dia.map(x=>x.n),borderColor:'#F0B429',backgroundColor:'rgba(240,180,41,.08)',fill:true,tension:.35,pointRadius:2,pointBackgroundColor:'#F0B429'}]
  },options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(238,233,224,.4)',maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(238,233,224,.4)',precision:0}}}}});
}

async function carregarUsuarios(){
  document.getElementById('users-cards').innerHTML = '<div class="loading">Carregando...</div>';
  const r = await fetch('/admin/usuarios?status=all&limit=200',{headers:H});
  const d = await r.json();
  todosUsuarios = d.usuarios||[];
  usersCarregados = true;
  renderUsuarios();
}

function renderUsuarios(){
  const q = (document.getElementById('busca')?.value||'').toLowerCase();
  const lista = todosUsuarios.filter(u=>{
    const ms = filtroAtual==='all' || u.status===filtroAtual;
    const mb = !q || (u.nome||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q);
    return ms && mb;
  });
  document.getElementById('users-cards').innerHTML = lista.length ? lista.map(u=>`
    <div class="user-card">
      <div class="uc-top">
        <div><div class="uc-name">${u.nome||'Sem nome'}</div><div class="uc-email">${u.email||'—'}</div></div>
        <span class="st st-${u.status}">${u.status}</span>
      </div>
      <div class="uc-meta">
        <span>📦 ${u.plano||'sem plano'}</span>
        ${u.trial_fim?`<span>⏱ ${fdt(u.trial_fim)}</span>`:''}
        <span>📅 ${fdt(u.criado_em)}</span>
      </div>
    </div>`).join('') : '<div class="loading">Nenhum encontrado</div>';
  document.getElementById('tbody').innerHTML = lista.length ? lista.map(u=>`
    <tr><td>${u.nome||'—'}</td><td style="color:var(--mt);font-size:12px">${u.email||'—'}</td>
    <td><span class="st st-${u.status}">${u.status}</span></td>
    <td>${u.plano||'—'}</td><td>${fdt(u.trial_fim)}</td><td>${fdt(u.criado_em)}</td></tr>`).join('')
    : '<tr><td colspan="6" style="color:var(--mt);text-align:center;padding:30px">Nenhum usuário</td></tr>';
}
carregar();
</script>
</body>
</html>
